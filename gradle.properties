android.useAndroidX=true
kotlin.code.style=official

# Increase default memory pool
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Speeds up the compilation for :app module, since it does not need to generate .java files for BuildConfig
android.enableBuildConfigAsBytecode=true

# Print dependency output result to console
dependency.analysis.print.build.health=true

# Enable direct toml update resolving
nl.littlerobots.vcu.resolver=true

# Enable test fixtures
android.experimental.enableTestFixturesKotlinSupport=true

# Paparazzi - only record failing snapshots
app.cash.paparazzi.overwriteOnMaxPercentDifference=true

# Enable isolated projects to speed up configuration cache
org.gradle.isolated-projects=true
